name: IntegraciónContinua para .NET Daniel

on:
  push:
    branches: [ "development", "141-crear-el-ci" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API: ./src/MODELO3D.API/MODELO3D.API.csproj
      WEB: ./src/MODELO3D.Web/MODELO3D.Web.csproj
      UT:  ./test/MODELO3D.UT/MODELO3D.UT.csproj
      UIT: ./test/MODELO3D.UIT/MODELO3D.UIT.csproj

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Info
        run: dotnet --info

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.API }}
          dotnet restore ${{ env.WEB }}
          dotnet restore ${{ env.UT }}
          dotnet restore ${{ env.UIT }}

      - name: Build the solution
        run: |
          dotnet build ${{ env.API }} --configuration Release --no-restore
          dotnet build ${{ env.WEB }} --configuration Release --no-restore
          dotnet build ${{ env.UT }}  --configuration Release --no-restore
          dotnet build ${{ env.UIT }} --configuration Release --no-restore

      - name: Run unit tests with report
        run: dotnet test ${{ env.UT }} --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ./test/MODELO3D.UT/TestResults/TestResults.trx
          if-no-files-found: error